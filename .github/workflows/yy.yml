name: Auto Update M3U Playlist

on:
  schedule:
    # 每 3 小时自动触发一次 (UTC 时间 0, 3, 6, 9, 12, 15, 18, 21 点)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 支持手动手动在 GitHub 上点击运行

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 GitHub Actions 写权限以提交文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate M3U File
        run: |
          python3 ysptp.py --export-m3u live.m3u

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live.m3u
          if git diff --staged --quiet; then
            echo "live.m3u 没有变化，跳过提交。"
          else
            git commit -m "auto: update live.m3u [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
